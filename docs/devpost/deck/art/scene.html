<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#4A2C17;--soft:#85634A;--paper:#FFFBF2;--cream:#FFF3DD;--line:#EED6AE;--orange:#FF8A3D;--orange-d:#D9621A;--teal:#22B4A3;--teal-d:#157F73}
*{box-sizing:border-box;margin:0}
html,body{width:1500px;height:1000px;overflow:hidden;background:#CDEBF5}
body{font-family:Fredoka,ui-rounded,sans-serif;color:var(--ink);position:relative}
svg.scene{position:absolute;inset:0}
svg text{font-family:Fredoka,sans-serif}
.panel{position:absolute;left:70px;top:64px;width:640px;background:var(--paper);border:5px solid var(--line);border-radius:36px;padding:38px 44px 40px;box-shadow:0 10px 0 var(--line),0 24px 40px rgba(60,32,12,.18)}
.tagpill{display:inline-block;background:var(--teal);color:#fff;font-weight:700;font-size:22px;border-radius:999px;padding:6px 18px}
.brand{font-size:40px;font-weight:700;margin-top:18px;letter-spacing:-.5px}
.brand .w{color:var(--orange)} .brand .m{color:var(--teal)}
h1{font-size:60px;line-height:1.08;font-weight:700;margin-top:10px;letter-spacing:-1px}
.hl{white-space:nowrap;background:linear-gradient(transparent 55%,#FFC56E 55%,#FFC56E 92%,transparent 92%);padding:0 6px;margin:0 -6px;color:var(--orange-d)}
.sub{font-size:25px;line-height:1.35;margin-top:18px;color:var(--soft);font-weight:500}
.chips{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.chip{background:#fff;border:4px solid var(--line);border-radius:999px;padding:8px 18px 8px 12px;font-size:22px;font-weight:700;display:flex;gap:8px;align-items:center;box-shadow:0 4px 0 var(--line)}
.chip i{font-style:normal;font-family:'Apple Color Emoji',sans-serif;font-size:24px}
.cta{display:inline-block;margin-top:28px;background:var(--orange);color:#fff;font-weight:700;font-size:26px;border-radius:999px;padding:14px 30px;box-shadow:0 6px 0 var(--orange-d)}
.cta span{opacity:.9;font-weight:500}
/* animations: all loop in 3 s */
.a{transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.12);opacity:.9}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(40px)}}
@keyframes beam{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-110px) scale(1.6)}}
@keyframes wiggle{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes rise{0%{opacity:0;transform:translateY(40px) scale(.7)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(-140px) scale(1.1)}}
@keyframes heat{0%,100%{transform:translateY(0);opacity:.3}50%{transform:translateY(-12px);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes reach{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
.sun{animation:pulse 3s ease-in-out infinite}
.cloud{animation:drift 3s ease-in-out infinite}
.b1{animation:beam 1.5s linear infinite}.b2{animation:beam 1.5s linear infinite;animation-delay:-.5s}.b3{animation:beam 1.5s linear infinite;animation-delay:-1s}
.wig{animation:wiggle 1.5s ease-in-out infinite}
.led{animation:blink 1s steps(1) infinite}.led2{animation:blink 1s steps(1) infinite;animation-delay:-.5s}
.bub1{animation:rise 3s ease-in infinite}.bub2{animation:rise 3s ease-in infinite;animation-delay:-1s}.bub3{animation:rise 3s ease-in infinite;animation-delay:-2s}
.heat1{animation:heat 1.5s ease-in-out infinite}.heat2{animation:heat 1.5s ease-in-out infinite;animation-delay:-.75s}
.bob{animation:bob 1.5s ease-in-out infinite}
.rec{animation:blink 1s steps(1) infinite}
html,body{background:transparent!important;width:1500px;height:1000px} svg{position:absolute;inset:0}</style></head><body><svg  viewBox="0 0 1500 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFE5F4"/><stop offset="1" stop-color="#E6F5F8"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86CFDD"/><stop offset="1" stop-color="#5DB3C8"/></linearGradient>
    <radialGradient id="sunG"><stop offset="0" stop-color="#FFE27A"/><stop offset=".55" stop-color="#FFD24D" stop-opacity=".8"/><stop offset="1" stop-color="#FFD24D" stop-opacity="0"/></radialGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E64B0"/><stop offset="1" stop-color="#1D4685"/></linearGradient>
    <linearGradient id="modg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3473C4"/><stop offset="1" stop-color="#22559B"/></linearGradient>
  </defs>
  <rect width="1500" height="600" fill="url(#sky)"/>
  <circle class="a sun" cx="1340" cy="120" r="130" fill="url(#sunG)"/>
  <circle cx="1340" cy="120" r="52" fill="#FFE07A"/>
  <g class="a cloud" fill="#fff" opacity=".95">
    <ellipse cx="880" cy="140" rx="70" ry="30"/><ellipse cx="840" cy="128" rx="38" ry="30"/><ellipse cx="905" cy="118" rx="44" ry="36"/>
  </g>
  <rect y="560" width="1500" height="440" fill="url(#sea)"/>
  <path d="M0 600 Q 200 590 400 600 T 800 600 T 1200 600 T 1500 598" stroke="#fff" stroke-opacity=".5" stroke-width="5" fill="none"/>
  <!-- sand island -->
  <ellipse cx="1060" cy="1060" rx="760" ry="430" fill="#E2BC7A"/>
  <ellipse cx="1060" cy="1070" rx="740" ry="410" fill="#F2D49B"/>
  <ellipse cx="300" cy="1080" rx="420" ry="200" fill="#E2BC7A"/>
  <ellipse cx="300" cy="1090" rx="405" ry="185" fill="#F2D49B"/>

</svg><script>document.getAnimations().forEach(a=>{a.pause();a.currentTime=700})</script></body></html>
