<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Bubble Pop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/wm-base.css">
  <style>
    /* PLACEHOLDER: Bubble Pop is not built yet. The floating bubbles can be popped for fun. */
    html, body { height: 100%; overflow: hidden; }
    body {
      display: grid; place-items: center;
      background: linear-gradient(180deg, #A9D8FF 0%, #D9C7FF 55%, #FFD6EC 100%);
      touch-action: manipulation;
    }
    #sky { position: fixed; inset: 0; }
    .bubble {
      position: absolute; bottom: -140px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 28%, rgba(255,255,255,.95) 0 9%, transparent 10%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0) 55%, rgba(255,255,255,.55) 70%, hsla(var(--h), 90%, 75%, .55) 100%);
      box-shadow: inset 0 0 18px hsla(var(--h), 90%, 70%, .6);
      animation: rise var(--t) linear forwards, sway 3s ease-in-out infinite alternate;
      cursor: pointer;
    }
    .bubble.pop { animation: pop .25s ease-out forwards; pointer-events: none; }
    @keyframes rise { to { bottom: 110%; } }
    @keyframes sway { from { margin-left: -14px; } to { margin-left: 14px; } }
    @keyframes pop { to { transform: scale(1.5); opacity: 0; } }
    .card { position: relative; z-index: 1; width: min(560px, calc(100vw - 32px)); padding: 28px 28px 22px; text-align: center; pointer-events: none; }
    .card .wm-btn, .card button { pointer-events: auto; }
    .art { font-size: 110px; margin-top: -86px; }
    .art .wm-emoji { display: inline-block; animation: wm-bob 2s ease-in-out infinite; }
    h1 { margin: 6px 0 4px; font-size: 40px; }
    .soon { display: inline-block; padding: 4px 16px; border-radius: 999px; background: #5BA8F8; color: #fff; font-weight: 700; font-size: 16px; letter-spacing: .04em; }
    p.lead { font-size: 19px; color: var(--ink-soft); margin: 14px 0 18px; line-height: 1.4; }
    .wm-pip { justify-content: center; text-align: left; }
    .count { font-weight: 700; color: #2C74C9; }
  </style>
</head>
<body>
  <div id="sky" aria-hidden="true"></div>
  <main class="card wm-card">
    <div class="art" aria-hidden="true"><span class="wm-emoji">🫧</span></div>
    <h1>Bubble Pop</h1>
    <span class="soon">COMING SOON</span>
    <p class="lead">Pop the floating bubbles before they drift away!</p>
    <div class="wm-pip">
      <img src="../../shared/assets/mascot.svg" alt="Pip">
      <div class="wm-bubble">I'm still blowing the bubbles! Try popping these ones for practice. <span class="count" id="count"></span></div>
    </div>
  </main>
  <script src="../../shared/wm-bridge.js"></script>
  <script>
    (function () {
      const sky = document.getElementById('sky');
      const countEl = document.getElementById('count');
      let popped = 0, timer = null;

      function spawn() {
        const b = document.createElement('div');
        const size = 50 + Math.random() * 70;
        b.className = 'bubble';
        b.style.width = b.style.height = size + 'px';
        b.style.left = Math.random() * 92 + '%';
        b.style.setProperty('--h', Math.round(Math.random() * 360));
        b.style.setProperty('--t', 7 + Math.random() * 6 + 's');
        b.addEventListener('pointerdown', () => {
          b.classList.add('pop');
          popped++;
          countEl.textContent = `Popped: ${popped} 🎉`;
          setTimeout(() => b.remove(), 260);
        });
        b.addEventListener('animationend', e => { if (e.animationName === 'rise') b.remove(); });
        sky.appendChild(b);
      }

      function start() { if (!timer) { spawn(); timer = setInterval(spawn, 900); } }
      function stop() { clearInterval(timer); timer = null; }

      // pause bubbles while another game tab is showing
      WM.bridge.onVisibility(v => (v ? start() : stop()));
      start();
    })();
  </script>
</body>
</html>
