<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7FD8E8">
  <title>Treasure Reach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/wm-base.css">
  <link rel="stylesheet" href="../../shared/wm-pip.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== Scenery ===== -->
  <div class="scene" aria-hidden="true">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <svg class="hills" viewBox="0 0 1440 800" preserveAspectRatio="none">
      <path class="sea" d="M0 330 L1440 330 L1440 800 L0 800Z"/>
      <path class="sea-hi" d="M0 330 C 240 320 480 342 720 330 C 960 318 1200 342 1440 330 L1440 346 C 1200 358 960 334 720 346 C 480 358 240 334 0 346Z"/>
      <path class="island" d="M40 800 C 140 560 420 500 720 494 C 1020 500 1300 560 1400 800Z"/>
      <path class="island-hi" d="M200 640 C 360 560 560 540 720 538 C 880 540 1080 560 1240 640" fill="none"/>
    </svg>
    <div class="decor">
      <span style="left:3%;top:36%;font-size:17vmin">🌴</span>
      <span style="left:62%;top:30%;font-size:6vmin">⛵</span>
      <span style="left:12%;top:20%;font-size:5vmin;animation-delay:-1s">🦜</span>
      <span style="left:70%;top:82%;font-size:5vmin;animation-delay:-2s">🐚</span>
      <span style="left:9%;top:84%;font-size:6vmin;animation-delay:-3s">🦀</span>
    </div>
  </div>

  <!-- ===== Treasure chest (placeholder art, inline so the lid can animate) ===== -->
  <main class="chest-stage">
    <div class="chest-anchor" id="chestAnchor"></div>
    <div class="chest" id="chest" aria-label="Treasure chest">
      <div class="chest-glow"></div>
      <div class="chest-rays"></div>
      <svg class="chest-svg" viewBox="0 0 260 230" aria-hidden="true">
        <defs>
          <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B8733A"/><stop offset="1" stop-color="#8A4E22"/></linearGradient>
          <linearGradient id="woodLid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D08C4E"/><stop offset="1" stop-color="#9A5A28"/></linearGradient>
          <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE68A"/><stop offset="1" stop-color="#E9A100"/></linearGradient>
          <radialGradient id="inside" cx="50%" cy="60%" r="60%"><stop offset="0" stop-color="#FFF8C8"/><stop offset=".45" stop-color="#FFC94A"/><stop offset="1" stop-color="#7A3E14"/></radialGradient>
        </defs>
        <ellipse class="chest-inside" cx="130" cy="114" rx="106" ry="24" fill="url(#inside)"/>
        <g class="chest-base" stroke="#5A2F12" stroke-width="5" stroke-linejoin="round">
          <rect x="22" y="110" width="216" height="106" rx="14" fill="url(#wood)"/>
          <path d="M28 144 H232 M28 178 H232" stroke="#6E3A16" stroke-width="3" opacity=".55"/>
          <rect x="50" y="110" width="22" height="106" fill="url(#gold)"/>
          <rect x="188" y="110" width="22" height="106" fill="url(#gold)"/>
          <rect x="104" y="122" width="52" height="58" rx="11" fill="url(#gold)"/>
          <circle cx="130" cy="144" r="7" fill="#5A2F12" stroke="none"/>
          <path d="M125.5 148 H134.5 L132.5 166 H127.5Z" fill="#5A2F12" stroke="none"/>
        </g>
        <g class="chest-lid" stroke="#5A2F12" stroke-width="5" stroke-linejoin="round">
          <path d="M18 114 V82 Q18 22 130 22 Q242 22 242 82 V114 Z" fill="url(#woodLid)"/>
          <path d="M50 114 V36 Q60 30 72 28 V114 Z" fill="url(#gold)"/>
          <path d="M188 28 Q200 30 210 36 V114 H188 Z" fill="url(#gold)"/>
          <rect x="12" y="102" width="236" height="16" rx="7" fill="url(#gold)"/>
          <path d="M116 106 H144 V122 A14 14 0 0 1 116 122 Z" fill="url(#gold)"/>
          <path d="M66 54 Q130 34 194 54" stroke="#fff" stroke-opacity=".35" stroke-width="7" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
      <div class="reward" id="reward"><span class="reward-art wm-emoji"></span><span class="reward-name"></span></div>
    </div>
  </main>

  <!-- hands + coins -->
  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <button id="menuBtn" class="chunky-btn menu-btn" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <span class="btn-label">Menu</span>
    </button>
    <div class="title-pill">
      <span class="wm-emoji">💰</span>
      <span class="tp-name">Treasure Reach</span>
      <span class="set-dots" id="setDots" aria-label="Chests opened this set"></span>
    </div>
    <div class="top-right">
      <button id="helpBtn" class="chunky-btn round help-btn" aria-label="How to play">?</button>
      <button id="soundBtn" class="chunky-btn round" aria-label="Toggle sound">🔊</button>
    </div>
  </header>

  <!-- ===== Reach progress bar (right) ===== -->
  <aside class="reach-meter" id="reachMeter" aria-label="Reach progress">
    <div class="rm-head"><span class="wm-emoji">🙌</span> Reach</div>
    <div class="rm-goal"><span class="wm-emoji">⭐</span><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" pathLength="100" id="rmHoldRing"/></svg></div>
    <div class="rm-body">
      <div class="rm-track">
        <div class="rm-fill" id="rmFill"></div>
        <div class="rm-tick" style="bottom:50%"></div>
        <div class="rm-tick" style="bottom:25%"></div>
        <div class="rm-tick" style="bottom:75%"></div>
      </div>
      <div class="rm-hand left" id="rmLeft" title="Left hand"></div>
      <div class="rm-hand right" id="rmRight" title="Right hand"></div>
    </div>
    <div class="rm-val" id="rmVal">0%</div>
  </aside>

  <!-- ===== Camera panel: big for calibration, then docked bottom-left ===== -->
  <section class="cam-panel calibrating" id="camPanel" aria-label="Camera">
    <div class="cam-head">
      <span class="cam-title">📷 Pip's camera</span>
      <span class="cam-status" id="camStatus"></span>
      <button class="cam-toggle" id="camHide" aria-label="Hide camera" title="Hide camera">👁️</button>
    </div>
    <div class="cam-view">
      <video id="camVideo" playsinline muted></video>
      <canvas id="camOverlay"></canvas>
      <div class="cam-off"><span class="wm-emoji">📷</span><b id="camOffText">Camera is off</b></div>
    </div>
    <div class="cam-calib" id="camCalib"></div>
  </section>
  <button class="cam-pill" id="camShow">📷 Show camera</button>

  <!-- ===== Menu ===== -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <nav class="drawer" id="drawer" aria-label="Menu">
    <div class="drawer-head">
      <h2>💰 Treasure Reach</h2>
      <button class="close-btn" id="drawerClose" aria-label="Close menu">✕</button>
    </div>
    <p class="drawer-sub">Chests opened: <b id="totalChests">0</b></p>

    <div class="seg two" id="inputToggle" role="group" aria-label="Play with">
      <button data-input="camera">📷 Camera</button>
      <button data-input="mouse">🖱️ Mouse</button>
    </div>
    <button class="wm-btn primary" id="recalBtn">🎯 Redo reach setup</button>
    <button class="wm-btn" id="drawerHelp">🎓 How to play</button>

    <details class="grownups" open>
      <summary>👪 For grown-ups</summary>
      <p class="gu-note" id="calibInfo"></p>
      <div class="gu-row">
        <label class="gu-label" for="goalPct">Reach goal <b id="goalPctVal">90%</b> of comfy reach</label>
        <input type="range" id="goalPct" min="50" max="150" step="5">
      </div>
      <div class="gu-row">
        <span class="gu-label">Hold at the goal for</span>
        <div class="seg three" id="holdToggle">
          <button data-hold="300">0.3 s</button><button data-hold="800">0.8 s</button><button data-hold="1500">1.5 s</button>
        </div>
      </div>
      <div class="gu-row">
        <span class="gu-label">Which hands count</span>
        <div class="seg two" id="handsToggle">
          <button data-hands="either">Either hand</button><button data-hands="both">Both hands</button>
        </div>
      </div>
      <div class="gu-row">
        <span class="gu-label">Chests per set</span>
        <div class="seg three" id="setToggle">
          <button data-set="3">3</button><button data-set="5">5</button><button data-set="10">10</button>
        </div>
      </div>
      <div class="gu-row">
        <span class="gu-label">Practice log</span>
        <span class="gu-note" id="logInfo"></span>
        <button class="wm-btn small" id="exportLog">⬇️ Download log (JSON)</button>
      </div>
      <button class="wm-link" id="resetBtn">Reset setup, settings &amp; log</button>
    </details>
  </nav>

  <!-- ===== Set complete ===== -->
  <div class="modal" id="setModal" role="dialog" aria-label="Set complete">
    <div class="panel set-panel wm-card">
      <div class="set-art wm-emoji">🏆</div>
      <h2>Set complete!</h2>
      <p>You opened <b id="setCount">5</b> treasure chests!</p>
      <p class="set-best">Best reach: <b id="setBest">100%</b> of your goal</p>
      <button class="wm-btn primary" id="setAgain">Keep going! 💰</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="../../shared/wm-bridge.js"></script>
  <script src="../../shared/wm-sound.js"></script>
  <script src="../../shared/wm-pip.js"></script>
  <script src="../../shared/wm-hands.js"></script>
  <script src="js/data.js"></script>
  <script src="js/calib.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
