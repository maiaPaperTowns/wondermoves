profiles:
  default:
    fqbn: arduino:zephyr:unoq
    platforms:
      - platform: arduino:zephyr
    libraries:
      # Versions must exist in the board's library_index.json (Nov 2025).
      # If the board clock is wrong, pre-stage the zips: see board/README.md
      - MsgPack (0.4.2)
      - DebugLog (0.8.4)
      - ArxContainer (0.7.0)
      - ArxTypeTraits (0.3.2)
      - Arduino_Modulino (0.6.1)
      - Arduino_HS300x (1.0.0)
      - Arduino_LPS22HB (1.0.2)
      - Arduino_LSM6DSOX (1.1.2)
      - STM32duino VL53L4CD (1.0.5)
      - STM32duino VL53L4ED (1.0.1)
default_profile: default
